# ===== CPU Loader 配置文件示例 =====
# 用法: java -jar build/cpu-loader.jar --config config.properties
# 命令行参数的优先级高于本文件，例如:
#   java -jar build/cpu-loader.jar --config config.properties --target 40

# 目标整机 CPU 使用率，1-100
target = 60

# 工作线程数，0 表示按逻辑核心数自动
threads = 0

# 运行时长: 30s / 10m / 2h；0 或 inf 表示一直运行
duration = inf

# 占空比控制周期（毫秒），一般不用改
period = 100

# 负载类型: mix / int / float / mem / crypto
workload = mix

# 状态输出间隔（秒），0 表示关闭
status-interval = 2
